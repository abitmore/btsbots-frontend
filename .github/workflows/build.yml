name: BTSBots Multi-Platform CI/CD Build

on:
  push:
    tags:
      - 'v*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-linux:
    name: Build Linux Desktop (Tauri Deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Linux (Deb Only)
        run: |
          mkdir -p release-artifacts

          echo "=== 正在构建 Wallet Linux Deb ==="
          npm run build:wallet
          npm exec tauri build
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-artifacts/btsbots-wallet_amd64.deb \;

          rm -rf src-tauri/target/release/bundle/

          echo "=== 正在构建 Market Linux Deb ==="
          npm run build:market
          npm exec tauri build -- --config src-tauri/tauri.market.conf.json
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-artifacts/btsbots-market_amd64.deb \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-desktop-linux
          path: release-artifacts/*.deb

  build-desktop-windows:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Windows Installers
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts

          Copy-Item -Path "src-tauri\tauri.conf.json" -Destination "src-tauri\tauri.conf.json.bak" -Force

          echo "=== 正在构建 Wallet Windows 安装包 ==="
          npm run build:wallet
          npx tauri build
          Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi" | Copy-Item -Destination "release-artifacts\btsbots-wallet-setup.msi" -Force

          Remove-Item -Recurse -Force "src-tauri\target\release\bundle" -ErrorAction SilentlyContinue

          echo "=== 正在构建 Market Windows 安装包 ==="
          npm run build:market
          Copy-Item -Path "src-tauri\tauri.conf.json" -Destination "src-tauri\tauri.conf.json.bak" -Force

          npx tauri build

          $marketMsi = Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi"
          if ($marketMsi) {
              $marketMsi | Copy-Item -Destination "release-artifacts\btsbots-market-setup.msi" -Force
          } else {
              Write-Error "Market MSI not found!"
              exit 1
          }

          Move-Item -Path "src-tauri\tauri.conf.json.bak" -Destination "src-tauri\tauri.conf.json" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-desktop-windows
          path: release-artifacts/*.msi
          if-no-files-found: error

  build-android-apks:
    name: Build Android APKs (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools-version: 34.0.0
          android-version: platform-34

      - name: Install Android Build Tools 29.0.3 for Signer
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Install NPM Dependencies
        run: npm install

      - name: Fix Android Java Version & Build APKs
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

          mkdir -p release-artifacts

          # ==================== 1. 构建 Wallet Android APK ====================
          echo "=== 正在构建 Wallet Android APK ==="
          npm run build:wallet
          ln -sf capacitor.wallet.config.ts capacitor.config.ts
          npx cap sync android

          # 彻底清空旧 mipmap 防止图标冲突
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable-v24/ic_launcher*
          
          if [ -d "android/app/src/wallet/res" ]; then
            echo "--- 正在复制 Wallet 自定义资源 ---"
            cp -rf android/app/src/wallet/res/* android/app/src/main/res/
          else
            echo "--- [WARN] 找不到 android/app/src/wallet/res ---"
          fi

          cd android
          chmod +x gradlew
          ./gradlew clean assembleWalletRelease
          cd ..
          find android/app/build/outputs/apk/wallet/release/ -name "*.apk" -exec cp {} release-artifacts/btsbots-wallet.apk \;


          # ==================== 2. 构建 Market Android APK ====================
          echo "=== 正在构建 Market Android APK ==="
          npm run build:market
          ln -sf capacitor.market.config.ts capacitor.config.ts
          npx cap sync android

          # 彻底清空旧 mipmap 防止图标冲突
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable-v24/ic_launcher*

          if [ -d "android/app/src/market/res" ]; then
            echo "--- 正在复制 Market 自定义资源 ---"
            cp -rf android/app/src/market/res/* android/app/src/main/res/
          else
            echo "--- [WARN] 找不到 android/app/src/market/res ---"
          fi

          cd android
          chmod +x gradlew
          ./gradlew clean assembleMarketRelease
          cd ..
          find android/app/build/outputs/apk/market/release/ -name "*.apk" -exec cp {} release-artifacts/btsbots-market.apk \;

      - name: Sign Android APKs
        uses: r0adkll/sign-android-release@v1
        id: sign_apks
        with:
          releaseDirectory: release-artifacts
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up Unsigned and Intermediate APKs
        run: |
          echo "=== 清理中间过程 APK，只保留最终签名版 ==="
          cd release-artifacts
          
          if [ -f "btsbots-wallet-signed.apk" ]; then
            mv -f btsbots-wallet-signed.apk btsbots-wallet.apk
          elif [ -f "btsbots-wallet-aligned.apk" ]; then
            mv -f btsbots-wallet-aligned.apk btsbots-wallet.apk
          fi

          if [ -f "btsbots-market-signed.apk" ]; then
            mv -f btsbots-market-signed.apk btsbots-market.apk
          elif [ -f "btsbots-market-aligned.apk" ]; then
            mv -f btsbots-market-aligned.apk btsbots-market.apk
          fi

          rm -f *-unsigned.apk *-aligned.apk *-unaligned.apk *-signed.apk || true
          ls -la

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: release-artifacts/*.apk

  create-github-release:
    name: Publish Release to GitHub
    needs: [build-desktop-linux, build-desktop-windows, build-android-apks]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-files
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -la final-release-files

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
